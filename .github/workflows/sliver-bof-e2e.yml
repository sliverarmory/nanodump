name: Sliver BOF end-to-end

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bof-e2e:
    uses: sliverarmory/sliver-test-bof/.github/workflows/e2e.yml@b38a09a226bf861a1e56e9dbe07838fe99138582
    with:
      manifest: .github/sliver-bof-e2e.yml
      prepare-command: >-
        sudo apt-get update &&
        sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 &&
        ./scripts/build-armory-bof.sh
